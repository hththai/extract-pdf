# Map CF-Connecting-IP (real device IP via Cloudflare tunnel) to $real_ip,
# falling back to the direct connection address when not behind Cloudflare.
map $http_cf_connecting_ip $real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

log_format cf_access escape=json
    '{"time":"$time_iso8601",'
    '"ip":"$real_ip",'
    '"addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"ua":"$http_user_agent",'
    '"source":"client"}';
