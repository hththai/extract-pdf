<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Statement Extractor</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6e6e73;
      margin-bottom: 2rem;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #d1d1d6;
      border-radius: 12px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .drop-zone.drag-over {
      border-color: #0071e3;
      background: #f0f6ff;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      line-height: 1;
    }

    .drop-label {
      font-size: 0.95rem;
      color: #1d1d1f;
      font-weight: 500;
    }

    .drop-hint {
      font-size: 0.8rem;
      color: #6e6e73;
      margin-top: 0.4rem;
    }

    /* File preview */
    .file-preview {
      display: none;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #f5f5f7;
      border-radius: 8px;
      font-size: 0.875rem;
    }

    .file-preview.visible {
      display: flex;
    }

    .file-preview .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #6e6e73;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.25rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .remove-btn:hover {
      color: #ff3b30;
    }

    /* Submit button */
    .submit-btn {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.85rem;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .submit-btn:hover:not(:disabled) {
      background: #0077ed;
    }

    .submit-btn:disabled {
      background: #b0c8e8;
      cursor: not-allowed;
    }

    /* Status */
    .status {
      display: none;
      margin-top: 1.25rem;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .status.visible {
      display: block;
    }

    .status.loading {
      background: #f5f5f7;
      color: #6e6e73;
    }

    .status.success {
      background: #e8f8ef;
      color: #1a7f45;
    }

    .status.error {
      background: #fff0f0;
      color: #c0392b;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #b0b0b8;
      border-top-color: #6e6e73;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Validation badge */
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    .badge.valid {
      background: #d1fae5;
      color: #065f46;
    }

    .badge.invalid {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Bank Statement Extractor</h1>
    <p class="subtitle">Upload a PDF bank statement to extract transactions as CSV</p>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf,application/pdf" />
      <div class="drop-icon">📄</div>
      <div class="drop-label">Drop your PDF here</div>
      <div class="drop-hint">or click to browse — PDF only, max 10 MB</div>
    </div>

    <div class="file-preview" id="filePreview">
      <span>📎</span>
      <span class="file-name" id="fileName"></span>
      <button class="remove-btn" id="removeBtn" title="Remove file">✕</button>
    </div>

    <button class="submit-btn" id="submitBtn" disabled>Extract CSV</button>

    <div class="status" id="status"></div>
  </div>

  <script>
    const API_BASE = "${API_URL}";

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const filePreview = document.getElementById("filePreview");
    const fileNameEl = document.getElementById("fileName");
    const removeBtn = document.getElementById("removeBtn");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");

    let selectedFile = null;

    function setFile(file) {
      if (!file || file.type !== "application/pdf") {
        showStatus("error", "Please select a valid PDF file.");
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showStatus("error", "File is too large (max 10 MB).");
        return;
      }
      selectedFile = file;
      fileNameEl.textContent = file.name;
      filePreview.classList.add("visible");
      submitBtn.disabled = false;
      clearStatus();
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = "";
      filePreview.classList.remove("visible");
      submitBtn.disabled = true;
      clearStatus();
    }

    function showStatus(type, html) {
      statusEl.className = `status visible ${type}`;
      statusEl.innerHTML = html;
    }

    function clearStatus() {
      statusEl.className = "status";
      statusEl.innerHTML = "";
    }

    // Drag and drop
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("drag-over");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("drag-over");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      const file = e.dataTransfer.files[0];
      if (file) setFile(file);
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    removeBtn.addEventListener("click", clearFile);

    // Submit
    submitBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      submitBtn.disabled = true;
      showStatus("loading", `<span class="spinner"></span>Extracting transactions…`);

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const res = await fetch(`${API_BASE}/extract-csv`, {
          method: "POST",
          body: formData,
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || "Extraction failed");
        }

        // Parse validation status and row count from Content-Disposition filename
        const disposition = res.headers.get("Content-Disposition") || "";
        const match = disposition.match(/filename=(\S+)/);
        const csvName = match ? match[1] : "transactions.csv";

        const isValid = csvName.startsWith("true_validation");
        const rowMatch = csvName.match(/_(\d+)\.csv$/);
        const rowCount = rowMatch ? rowMatch[1] : "?";

        // Trigger download
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = csvName;
        a.click();
        URL.revokeObjectURL(url);

        const badge = isValid
          ? `<span class="badge valid">Valid</span>`
          : `<span class="badge invalid">Invalid</span>`;

        showStatus(
          "success",
          `Downloaded <strong>${csvName}</strong> — ${rowCount} rows ${badge}`
        );
      } catch (err) {
        showStatus("error", `Error: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
