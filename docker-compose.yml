services:
  api:
    build: ./pdf_api
    container_name: ocr_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./pdf_api/.env        # local dev fallback — overridden by environment: below
    environment:
      - ENV=${ENV:-dev}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - MAX_PDF_BYTES=${MAX_PDF_BYTES:-10485760}
      - LOG_DIR=/app/logs/api
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - AI_BASE_URL=${AI_BASE_URL:-http://localhost:11434}
      - AI_MODEL=${AI_MODEL:-llama3.2}
      - AI_REQUEST_TIMEOUT=${AI_REQUEST_TIMEOUT:-30}
      - AI_CLASSIFY_CONCURRENCY=${AI_CLASSIFY_CONCURRENCY:-10}
      - AI_CLASSIFY_SYSTEM_PROMPT=${AI_CLASSIFY_SYSTEM_PROMPT:-}
    volumes:
      - ./logs/api:/app/logs/api
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-0.5}"
          memory: "${API_MEM_LIMIT:-512m}"
        reservations:
          cpus: "0.1"
          memory: "128m"

  client:
    build: ./client
    container_name: ocr_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    environment:
      - API_URL=${API_URL:-http://localhost:8000}
    volumes:
      - ./logs/client:/var/log/nginx
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "${CLIENT_CPU_LIMIT:-0.1}"
          memory: "${CLIENT_MEM_LIMIT:-32m}"
        reservations:
          cpus: "0.05"
          memory: "16m"
