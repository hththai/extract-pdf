services:
  api:
    build: ./pdf_api
    container_name: ocr_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./pdf_api/.env
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-0.5}"
          memory: "${API_MEM_LIMIT:-512m}"
        reservations:
          cpus: "0.1"
          memory: "128m"

  client:
    build: ./client
    container_name: ocr_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "${CLIENT_CPU_LIMIT:-0.1}"
          memory: "${CLIENT_MEM_LIMIT:-32m}"
        reservations:
          cpus: "0.05"
          memory: "16m"
